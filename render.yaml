services:
  # ─── 1. Django REST API Backend ───
  - type: web
    name: questmore-django-backend
    runtime: python
    region: oregon
    plan: free
    rootDir: backend
    buildCommand: "pip install -r requirements.txt && python manage.py collectstatic --noinput && python manage.py migrate && python manage.py seed_questmore"
    startCommand: "gunicorn questmore.wsgi:application --bind 0.0.0.0:$PORT"
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: DEBUG
        value: "False"
      - key: SECRET_KEY
        generateValue: true
      - key: ALLOWED_HOSTS
        value: "*"
      - key: CORS_ALLOW_ALL
        value: "True"
      - key: DATABASE_URL
        fromDatabase:
          name: questmore-postgres-db
          property: connectionString

  # ─── 2. Next.js Frontend Web App ───
  - type: web
    name: questmore-app
    runtime: node
    region: oregon
    plan: free
    buildCommand: "npm install && npm run build"
    startCommand: "npm start"
    envVars:
      - key: NODE_VERSION
        value: 20.x
      - key: NEXT_PUBLIC_DJANGO_API_URL
        fromService:
          type: web
          name: questmore-django-backend
          property: host

# ─── 3. Managed PostgreSQL Database ───
databases:
  - name: questmore-postgres-db
    region: oregon
    plan: free
    databaseName: questmore_db
    user: questmore_user
