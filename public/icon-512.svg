<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0E1F36"/>
      <stop offset="100%" stop-color="#07111F"/>
    </linearGradient>
    <linearGradient id="gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FDE68A"/>
      <stop offset="40%" stop-color="#F59E0B"/>
      <stop offset="100%" stop-color="#D97706"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="6" result="coloredBlur"/>
      <feMerge><feMergeNode in="coloredBlur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="512" height="512" rx="110" fill="url(#bg)"/>

  <!-- Blueprint grid lines -->
  <line x1="170" y1="0" x2="170" y2="512" stroke="rgba(245,158,11,0.05)" stroke-width="1.5"/>
  <line x1="342" y1="0" x2="342" y2="512" stroke="rgba(245,158,11,0.05)" stroke-width="1.5"/>
  <line x1="0" y1="170" x2="512" y2="170" stroke="rgba(245,158,11,0.05)" stroke-width="1.5"/>
  <line x1="0" y1="342" x2="512" y2="342" stroke="rgba(245,158,11,0.05)" stroke-width="1.5"/>

  <!-- Outer accent ring -->
  <circle cx="256" cy="256" r="168" fill="none" stroke="url(#gold)" stroke-width="4" stroke-opacity="0.20"/>

  <!-- Corner engineering accent marks -->
  <line x1="80" y1="96" x2="80" y2="76" stroke="rgba(245,158,11,0.35)" stroke-width="3" stroke-linecap="round"/>
  <line x1="76" y1="80" x2="96" y2="80" stroke="rgba(245,158,11,0.35)" stroke-width="3" stroke-linecap="round"/>
  <line x1="432" y1="96" x2="432" y2="76" stroke="rgba(245,158,11,0.35)" stroke-width="3" stroke-linecap="round"/>
  <line x1="436" y1="80" x2="416" y2="80" stroke="rgba(245,158,11,0.35)" stroke-width="3" stroke-linecap="round"/>
  <line x1="80" y1="416" x2="80" y2="436" stroke="rgba(245,158,11,0.35)" stroke-width="3" stroke-linecap="round"/>
  <line x1="76" y1="432" x2="96" y2="432" stroke="rgba(245,158,11,0.35)" stroke-width="3" stroke-linecap="round"/>
  <line x1="432" y1="416" x2="432" y2="436" stroke="rgba(245,158,11,0.35)" stroke-width="3" stroke-linecap="round"/>
  <line x1="436" y1="432" x2="416" y2="432" stroke="rgba(245,158,11,0.35)" stroke-width="3" stroke-linecap="round"/>

  <!-- Q letter -->
  <text
    x="256" y="318"
    font-family="system-ui, -apple-system, 'Helvetica Neue', sans-serif"
    font-size="220"
    font-weight="900"
    fill="url(#gold)"
    text-anchor="middle"
    filter="url(#glow)"
  >Q</text>

  <!-- Q tail -->
  <line x1="318" y1="316" x2="368" y2="376" stroke="url(#gold)" stroke-width="22" stroke-linecap="round" filter="url(#glow)"/>
</svg>
